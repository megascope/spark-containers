model_list:
  - model_name: os.environ/LITELLM_MODEL
    litellm_params:
      model: os.environ/LLAMA_CPP_MODEL
      api_base: http://llama-server:8000/v1
      api_key: os.environ/LLAMA_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true

litellm_settings:
  drop_params: true
  telemetry: false
