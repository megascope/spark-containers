model_list:
  - model_name: os.environ/LITELLM_MODEL
    litellm_params:
      model: os.environ/LLAMA_CPP_MODEL
      api_base: os.environ/LLAMA_API_BASE
      api_key: os.environ/LLAMA_API_KEY
      max_tokens: 8192
  - model_name: "vllm/*"
    litellm_params:
      model: "openai/*"
      api_base: os.environ/VLLM_API_BASE
      api_key: os.environ/VLLM_API_KEY
  - model_name: "ollama_chat/*"
    litellm_params:
      model: "ollama_chat/*"
      api_base: os.environ/OLLAMA_API_BASE

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true

litellm_settings:
  drop_params: true
  telemetry: false
  check_provider_endpoint: true
