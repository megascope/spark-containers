services:
  vllm-server:
    build:
      context: .
      args:
        VLLM_IMAGE: "${VLLM_IMAGE:-vllm/vllm-openai:v0.28.0}"
    restart: unless-stopped
    init: true
    gpus: all
    ports:
      - "${VLLM_LISTEN_ADDR:-127.0.0.1}:${VLLM_PORT:-8001}:8000"
    volumes:
      - type: bind
        source: "${HF_CACHE_DIR:-./empty-cache}"
        target: /hf-cache
        read_only: true
        bind:
          create_host_path: false
    environment:
      VLLM_API_KEY: "${VLLM_API_KEY:-${LLAMA_API_KEY:?set VLLM_API_KEY or LLAMA_API_KEY in .env}}"
      VLLM_MODEL: "${VLLM_MODEL:-}"
      VLLM_MAX_MODEL_LEN: "${VLLM_MAX_MODEL_LEN:-8192}"
      VLLM_GPU_MEMORY_UTILIZATION: "${VLLM_GPU_MEMORY_UTILIZATION:-0.50}"
      VLLM_MAX_NUM_SEQS: "${VLLM_MAX_NUM_SEQS:-4}"
      VLLM_EXTRA_ARGS: "${VLLM_EXTRA_ARGS:-[]}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      HOME: /tmp/home
      HF_HOME: /tmp/huggingface
      XDG_CACHE_HOME: /tmp/cache
      VLLM_CACHE_ROOT: /tmp/cache/vllm
      TRITON_CACHE_DIR: /tmp/cache/triton
      CUDA_CACHE_PATH: /tmp/cache/cuda
      PYTHONDONTWRITEBYTECODE: "1"
    shm_size: 2gb
    tmpfs:
      # Triton/FlashInfer load JIT-compiled shared libraries from this cache.
      - /tmp:rw,exec,nosuid,nodev,size=8g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024
    networks:
      - llm-backend
      - ingress
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
networks:
  ingress:
    driver: bridge
  llm-backend:
    external: true
    name: "${LLM_NETWORK:-spark-llm}"
