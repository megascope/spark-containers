services:
  llama-server:
    build:
      context: .
      args:
        UID: 10001
        GID: 10001

    container_name: llama-server
    restart: unless-stopped

    gpus: all

    ports:
      - "${BIND_ADDR}:8000"

    volumes:
      - "${MODELS_DIR}:/models:ro"

    command:
      - --model
      - "/models/${MODEL_FILE}"
      - --mmproj
      - "/models/${MMPROJ_FILE}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - "on"
      - --ctx-size
      - "8192"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=512m,mode=1777

    pids_limit: 256

    mem_swappiness: 0

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
