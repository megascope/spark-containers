services:
  llama-server:
    build:
      context: .
      args:
        UID: 10001
        GID: 10001
        LLAMA_CPP_REF: "${LLAMA_CPP_REF:-v0.4.1}"

    restart: unless-stopped
    init: true

    gpus: all

    ports:
      - "${LLAMA_LISTEN_ADDR:-127.0.0.1}:${LLAMA_PORT:-8000}:8000"

    volumes:
      - type: bind
        source: "${MODELS_DIR:-./empty-models}"
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${HF_CACHE_DIR:-./empty-models}"
        target: /hf-cache
        read_only: true
        bind:
          create_host_path: false

    environment:
      LLAMA_API_KEY: "${LLAMA_API_KEY:?set LLAMA_API_KEY in .env}"
      LLAMA_MODELS_MAX: "${LLAMA_MODELS_MAX:-1}"
      LLAMA_CACHE: /tmp/llama-cache
      LLAMA_CONTEXT_SIZE: "${LLAMA_CONTEXT_SIZE:-8192}"
      LLAMA_GPU_LAYERS: "${LLAMA_GPU_LAYERS:-999}"
      LLAMA_FLASH_ATTN: "${LLAMA_FLASH_ATTN:-on}"

    networks:
      - llm-backend
      - ingress

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=512m,mode=1777

    pids_limit: 256

    mem_swappiness: 0

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$LLAMA_API_KEY\" http://127.0.0.1:8000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  ingress:
    driver: bridge
  llm-backend:
    external: true
    name: "${LLM_NETWORK:-spark-llm}"
